<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Energy Signature Pattern Library</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Energy Signature Virtualization Library</h1>
  </header>

  <main>
    <section id="pattern-list-section">
      <h2>Patterns</h2>
      <div id="pattern-list"></div>
    </section>

    <section id="pattern-detail-section">
      <h2>Pattern Details</h2>
      <div id="pattern-detail">
        <p>Select a pattern to view details.</p>
      </div>
    </section>

    <section id="feature-detail-section">
      <h2>Feature Details</h2>
      <div id="feature-detail">
        <p>Select a feature to view its mathematical form.</p>
      </div>
    </section>
  </main>

  <footer>
    <small>Energy Signature Library &mdash; JSON-backed, HTML/JS interface</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
